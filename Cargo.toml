[package]
name = "aeropacket"
version = "0.1.0"
edition = "2024"
description = "Bit-packed, CRC-checked, COBS-framed LZ/DZ telemetry packets for low-bandwidth radio links."
license = "MIT OR Apache-2.0"

[dependencies]
cobs = { version = "0.5", default-features = false }
crc = "3"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["std"]
# `std` enables serde derives on the enums and the JSON CLI. The core codec is always no_std.
std = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "aeropacket"
path = "src/bin/cli.rs"
required-features = ["std"]
